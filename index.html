                showNotification("लेक्चर सफलतापूर्वक जुड़ गया!");
            } else {
                notesList.unshift({ id: Date.now(), title, subject: subj, content: desc || "Study notes." });
                showNotification("नोट्स / PDF सफलतापूर्वक जुड़ गया!");

            closeModal();
            renderContent();

            activeGroupRoom = name;
