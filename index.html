                                <button onclick="joinGroupRoom('${g.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm">
                                    Join Video/Mic
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    ${activeGroupRoom ? `
                        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-emerald-800">Room: ${activeGroupRoom}</span>
                                <span class="flex items-center gap-1.5 text-xs font-semibold text-emerald-600"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Connected</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="toggleRoomMic()" id="mic-toggle-btn" class="flex-1 ${isMicOn ? 'bg-red-500 text-white' : 'bg-slate-900 text-white'} py-2 rounded-xl text-xs font-bold transition-all">
                                    <i class="fa-solid ${isMicOn ? 'fa-microphone' : 'fa-microphone-slash'} mr-1"></i> ${isMicOn ? 'Mic On' : 'Mic Off'}
                                </button>
                                <button onclick="disconnectGroupRoom()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-xl text-xs font-bold">Disconnect</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            </div>
            `;
        }

        function joinGroupRoom(name) {
            activeGroupRoom = name;
            isMicOn = true;
